name: Game validation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'CHANGELOG.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test, build, and run Windows package
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      SDL_AUDIODRIVER: dummy
      RENPY_RENDERER: angle2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authoring dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Start-of-batch preflight
        run: python -m tools.preflight --require-clean
      - name: Validate graph, prose, assets, and generated scripts
        run: python -m tools.validate
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared structure and licensed material validation
        run: |
          node scripts/vn-contract.mjs game/data/story.json
          node --test scripts/vn-materials.test.mjs
          node scripts/vn-materials.mjs verify
      - uses: actions/cache@v4
        with:
          path: .runtime
          key: renpy-windows-8.5.3-ff57648f
      - name: Fetch and verify official SDK
        run: python -m tools.build.sdk
      - name: Preserve published statement names for v1 saves
        run: |
          New-Item -ItemType Directory -Force .runtime/compat | Out-Null
          Invoke-WebRequest -Uri "https://github.com/AureliusWu/Rain/releases/download/v1.1.0/BeforeTheRainStops-1.1.0-win.zip" -OutFile ".runtime/compat/BeforeTheRainStops-1.1.0-win.zip"
          python -m tools.build.seed_release_names --previous-zip .runtime/compat/BeforeTheRainStops-1.1.0-win.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ren'Py lint
        run: |
          & .\.runtime\renpy-8.5.3-sdk\lib\py3-windows-x86_64\python.exe .\.runtime\renpy-8.5.3-sdk\renpy.py . lint --error-code --all-problems
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run voice and extras interaction checks first
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m tools.build.display
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.build.verify_voice_smoke --sdk .runtime/renpy-8.5.3-sdk --iterations 2 --timeout 300
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload first extras interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extras-prefix-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/voice-smoke/01/screenshots/native-extras-*.png
            reports/voice-smoke/01/screenshots/scaled-extras-*.png
            reports/voice-smoke/01/stdout.txt
            reports/voice-smoke/01/stderr.txt
            reports/voice-smoke/01/process.json
            reports/voice-smoke/01/test-plan.rpy
            reports/voice-smoke/02/stdout.txt
            reports/voice-smoke/02/stderr.txt
            reports/voice-smoke/02/process.json
            reports/voice-smoke-acceptance.json
      - name: Build standalone Windows ZIP
        run: |
          python -m tools.build.package --sdk .\.runtime\renpy-8.5.3-sdk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Load real saves and extras unlocks from the published v1.1.0 EXE
        run: |
          $zip = Get-ChildItem dist -Filter '*-win.zip' | Select-Object -First 1
          python -m tools.build.verify_upgrade --previous-zip .runtime/compat/BeforeTheRainStops-1.1.0-win.zip --current-zip $zip.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload early real old-save upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-prefix-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/upgrade/acceptance.json
            reports/upgrade/writer/stdout.txt
            reports/upgrade/writer/stderr.txt
            reports/upgrade/writer/process.json
            reports/upgrade/writer/test-plan.rpy
            reports/upgrade/writer/screenshots/*.png
            reports/upgrade/reader/stdout.txt
            reports/upgrade/reader/stderr.txt
            reports/upgrade/reader/process.json
            reports/upgrade/reader/test-plan.rpy
            reports/upgrade/reader/screenshots/*.png
      - name: Run actual Windows interaction tests
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          python -m tools.build.display
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m tools.build.verify_package --source-sdk .\.runtime\renpy-8.5.3-sdk --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and boot EXE extracted from distribution
        run: |
          $zip = Get-ChildItem dist -Filter '*-win.zip' | Select-Object -First 1
          if (-not $zip) { throw 'Windows ZIP missing' }
          python -m tools.build.verify_package --zip $zip.FullName --timeout 2400
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item reports/package/screenshots/native-main-menu.png "dist/BeforeTheRainStops-$version-preview.png"
          Get-ChildItem dist -Filter '*.zip' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
          @{ commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; version = (Get-Content VERSION -Raw).Trim(); audio_driver = $env:SDL_AUDIODRIVER } | ConvertTo-Json | Set-Content reports/ci-context.json
      - name: Audit exact ZIP and export remote visual-review copies
        run: python -m tools.build.export_review
      - name: Upload sealed bounded review bundles
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ github.sha }}
          path: reports/remote-review/
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          if-no-files-found: warn
          path: |
            reports/
            reports/screenshots/
            dist/SHA256SUMS.txt
            log.txt
            errors.txt
            traceback.txt
      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.sha }}
          if-no-files-found: error
          path: dist/
      - name: Prepare bounded exact package and evidence transfers
        run: python -m tools.build.transfer_evidence
      - name: Upload exact transfer part 00
        if: ${{ hashFiles('transfer/part00/bundle.part') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-transfer-${{ github.sha }}-00
          path: transfer/part00/
          if-no-files-found: error
      - name: Upload exact transfer part 01
        if: ${{ hashFiles('transfer/part01/bundle.part') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-transfer-${{ github.sha }}-01
          path: transfer/part01/
          if-no-files-found: error
      - name: Upload exact transfer part 02
